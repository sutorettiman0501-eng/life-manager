<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div class="header-top">
      <h1>LIFE MANAGER</h1>
      <div class="year-selector">
        <button id="prev-year" class="year-btn">&#8249;</button>
        <span id="current-year" class="year-display">2026</span>
        <button id="next-year" class="year-btn">&#8250;</button>
      </div>
    </div>
    <nav>
      <button class="nav-btn active" data-view="vision">Vision</button>
      <button class="nav-btn" data-view="tasks">Tasks</button>
      <button class="nav-btn" data-view="tracker">Tracker</button>
      <button class="nav-btn" data-view="journal">Journal</button>
      <button class="nav-btn" data-view="wishlist">Wishlist</button>
    </nav>
  </header>

  <!-- Vision -->
  <div id="vision-view" class="view active">

    <!-- 年タイトル -->
    <div class="vision-year-title" id="vision-year-title">2026</div>

    <!-- ビジョンカード -->
    <div class="vision-section">
      <div class="section-heading">MY VISION</div>
      <div class="vision-grid" id="vision-grid"></div>
    </div>

    <!-- 年別目標 -->
    <div class="vision-section">
      <div class="section-heading-row">
        <div class="section-heading" id="goals-heading">2026 GOALS</div>
        <button class="edit-goals-btn" id="edit-goals-btn">編集</button>
      </div>
      <div class="goals-card" id="goals-display"></div>
      <div class="goals-edit hidden" id="goals-edit">
        <textarea id="goals-textarea" placeholder="例）&#10;・副業で月5万円達成&#10;・家族と月2回お出かけ&#10;・体重を5kg減らす"></textarea>
        <div class="goals-edit-actions">
          <button class="btn-secondary" id="cancel-goals">キャンセル</button>
          <button class="btn-primary" id="save-goals">保存</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ビジョン編集モーダル -->
  <div id="vision-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="vision-modal-title">Vision を編集</h2>
      <div class="form-group">
        <label>あなたにとって理想の姿</label>
        <textarea id="vision-textarea" rows="6" placeholder="理想の姿や大切にしたいことを書いてください"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-vision">キャンセル</button>
        <button class="btn-primary" id="save-vision">保存</button>
      </div>
    </div>
  </div>

  <!-- Tasks -->
  <div id="tasks-view" class="view">

    <!-- サブナビ -->
    <div class="sub-nav">
      <button class="sub-nav-btn active" data-task-view="gtd">ホーム</button>
      <button class="sub-nav-btn" data-task-view="cal">カレンダー</button>
      <button class="sub-nav-btn" data-task-view="cat">カテゴリ</button>
    </div>

    <!-- GTD ビュー -->
    <div id="task-gtd" class="task-subview active">
      <div class="panel-toggle">
        <button class="panel-btn active" data-panel="inbox">INBOX <span class="inbox-badge" id="inbox-badge">0</span></button>
        <button class="panel-btn" data-panel="today">今日</button>
      </div>
      <div class="gtd-layout">
        <div class="gtd-col active" id="inbox-col">
          <div class="col-header">
            <span class="col-title">INBOX</span>
            <span class="col-count" id="inbox-count">0</span>
          </div>
          <div class="quick-add-wrap">
            <input type="text" id="quick-add-input" class="quick-add-input" placeholder="タスクを素早く追加（Enterで保存）" autocomplete="off">
            <button id="quick-add-btn" class="quick-add-btn">追加</button>
          </div>
          <div id="inbox-list" class="task-list-zone"></div>
        </div>
        <div class="col-divider"></div>
        <div class="gtd-col" id="today-col">
          <div class="col-header">
            <button id="prev-day" class="arrow-sm">&#8249;</button>
            <span id="current-date" class="col-title"></span>
            <button id="next-day" class="arrow-sm">&#8250;</button>
          </div>
          <div id="time-blocks"></div>
        </div>
      </div>
    </div>

    <!-- カレンダービュー -->
    <div id="task-cal" class="task-subview">
      <div class="date-nav">
        <button id="prev-month" class="arrow-btn">&#8249;</button>
        <span id="current-month"></span>
        <button id="next-month" class="arrow-btn">&#8250;</button>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
    </div>

    <!-- カテゴリビュー -->
    <div id="task-cat" class="task-subview">
      <div class="view-header">
        <button id="manage-cat-btn" class="text-btn">カテゴリを管理</button>
      </div>
      <div id="category-list"></div>
    </div>

    <!-- FAB -->
    <button id="add-task-btn" class="fab">＋</button>

    <!-- タスクモーダル -->
    <div id="task-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="task-modal-title">タスクを追加</h2>
        <div class="form-group">
          <label>タスク名</label>
          <input type="text" id="task-title" placeholder="タスク名を入力" autocomplete="off">
        </div>
        <div class="form-group">
          <label>カテゴリ</label>
          <select id="task-category"><option value="">カテゴリなし</option></select>
        </div>
        <div class="form-group">
          <label>日付</label>
          <input type="date" id="task-date">
        </div>
        <div class="form-group">
          <label>時間（任意）</label>
          <div class="time-row">
            <div class="time-input-wrap">
              <span class="time-input-label">開始</span>
              <input type="time" id="task-time-start">
            </div>
            <span class="time-separator">〜</span>
            <div class="time-input-wrap">
              <span class="time-input-label">終了</span>
              <input type="time" id="task-time-end">
            </div>
          </div>
          <p class="form-hint">開始時間に合わせてブロックに自動振り分け</p>
        </div>
        <div class="form-group">
          <label>繰り返し</label>
          <select id="task-repeat">
            <option value="none">なし</option>
            <option value="daily">毎日</option>
            <option value="weekly">毎週</option>
            <option value="monthly">毎月</option>
          </select>
        </div>
        <div id="task-destination" class="destination-hint"></div>
        <div class="modal-actions">
          <button class="btn-secondary" id="cancel-task">キャンセル</button>
          <button class="btn-primary" id="save-task">保存</button>
        </div>
      </div>
    </div>

    <!-- カテゴリ管理モーダル -->
    <div id="category-modal" class="modal hidden">
      <div class="modal-content">
        <h2>カテゴリ管理</h2>
        <div class="form-group">
          <label>新しいカテゴリ</label>
          <div class="input-row">
            <input type="text" id="new-category-name" placeholder="カテゴリ名を入力">
            <button id="save-category" class="btn-primary">追加</button>
          </div>
        </div>
        <div id="category-modal-list"></div>
        <div class="modal-actions">
          <button id="close-category-modal" class="btn-secondary">閉じる</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Tracker -->
  <div id="tracker-view" class="view">

    <div class="tracker-header">
      <div class="tracker-date-nav">
        <button id="tracker-prev-day" class="arrow-btn">&#8249;</button>
        <span id="tracker-date"></span>
        <button id="tracker-next-day" class="arrow-btn">&#8250;</button>
      </div>
      <button id="add-habit-btn" class="text-btn">＋ 習慣を追加</button>
    </div>

    <div id="tracker-body" class="tracker-body"></div>

    <div class="tracker-stats-section">
      <div class="section-heading" style="padding:0 16px;">今月の実績</div>
      <div id="tracker-stats" class="tracker-stats"></div>
    </div>

  </div>

  <!-- 習慣追加モーダル -->
  <div id="habit-modal" class="modal hidden">
    <div class="modal-content">
      <h2>習慣を追加</h2>
      <div class="form-group">
        <label>習慣名</label>
        <input type="text" id="habit-name" placeholder="例：筋トレ、読書" autocomplete="off">
      </div>
      <div class="form-group">
        <label>いつやるか</label>
        <div class="time-of-day-select">
          <button class="tod-btn active" data-tod="morning">朝</button>
          <button class="tod-btn" data-tod="afternoon">昼</button>
          <button class="tod-btn" data-tod="evening">夜</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-habit">キャンセル</button>
        <button class="btn-primary" id="save-habit">追加</button>
      </div>
    </div>
  </div>

  <!-- Journal -->
  <div id="journal-view" class="view">

    <div class="sub-nav">
      <button class="sub-nav-btn active" data-journal-view="daily">日次</button>
      <button class="sub-nav-btn" data-journal-view="weekly">週次</button>
      <button class="sub-nav-btn" data-journal-view="monthly">月次</button>
    </div>

    <!-- 日次 -->
    <div id="journal-daily" class="journal-subview active">
      <div class="journal-date-nav">
        <button id="journal-prev-day" class="arrow-btn">&#8249;</button>
        <span id="journal-daily-label"></span>
        <button id="journal-next-day" class="arrow-btn">&#8250;</button>
      </div>
      <div id="journal-daily-content" class="journal-body"></div>
    </div>

    <!-- 週次 -->
    <div id="journal-weekly" class="journal-subview">
      <div class="journal-date-nav">
        <button id="journal-prev-week" class="arrow-btn">&#8249;</button>
        <span id="journal-weekly-label"></span>
        <button id="journal-next-week" class="arrow-btn">&#8250;</button>
      </div>
      <div id="journal-weekly-content" class="journal-body"></div>
    </div>

    <!-- 月次 -->
    <div id="journal-monthly" class="journal-subview">
      <div class="journal-date-nav">
        <button id="journal-prev-month-j" class="arrow-btn">&#8249;</button>
        <span id="journal-monthly-label"></span>
        <button id="journal-next-month-j" class="arrow-btn">&#8250;</button>
      </div>
      <div id="journal-monthly-content" class="journal-body"></div>
    </div>

  </div>

  <!-- Wishlist -->
  <div id="wishlist-view" class="view">

    <div class="wishlist-header">
      <div class="wishlist-tabs">
        <button class="wishlist-tab active" data-done="false">未着手</button>
        <button class="wishlist-tab" data-done="true">完了</button>
      </div>
      <button id="add-wish-btn" class="text-btn">＋ 追加</button>
    </div>

    <div id="wishlist-grid" class="wishlist-grid"></div>

  </div>

  <!-- Wishlist モーダル -->
  <div id="wish-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="wish-modal-title">アイテムを追加</h2>
      <div class="form-group">
        <label>アイテム名</label>
        <input type="text" id="wish-name" placeholder="アイテム名を入力" autocomplete="off">
      </div>
      <div class="form-group">
        <label>カテゴリ</label>
        <select id="wish-category">
          <option value="">カテゴリなし</option>
          <option value="なりたい姿">なりたい姿</option>
          <option value="やりたいこと">やりたいこと</option>
          <option value="行きたい場所">行きたい場所</option>
          <option value="ほしいもの">ほしいもの</option>
        </select>
      </div>
      <div class="form-group">
        <label>価格（任意）</label>
        <input type="number" id="wish-price" placeholder="例：15000">
      </div>
      <div class="form-group">
        <label>画像URL（任意）</label>
        <input type="url" id="wish-image-url" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>商品リンク（任意）</label>
        <input type="url" id="wish-url" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>メモ（任意）</label>
        <textarea id="wish-memo" rows="3" placeholder="メモを入力"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="cancel-wish">キャンセル</button>
        <button class="btn-primary" id="save-wish">保存</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
